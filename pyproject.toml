[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-agent-service"
version = "0.1.6"
description = "Independent layered memory service for Knowledge Agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "neo4j>=5.23,<6",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
knowledge-agent-service = "knowledge_agent_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]